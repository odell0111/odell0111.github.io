<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A tool, not a page. Nothing here is meant to be found, cited or
         indexed, and this is the only place that is true — see robots.txt,
         whose openness is deliberate and stays that way.

         `noindex` and not a `Disallow: /dev` in robots.txt. A disallowed URL
         is never fetched, so the tag inside it would never be read; the only
         thing a disallow buys is a page nobody has seen. -->
    <meta name="robots" content="noindex" />

    <title>Dev mode — odell.dev</title>

    <!-- Self-contained on purpose. Every path on this site is relative, so a
         stylesheet copied from the root would be requested at
         /dev/styles/… and 404. This page needs three lines of CSS, which is
         cheaper than a base tag and its consequences. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.6rem;
        padding: 2rem;
        background: #0b0f17;
        color: #e6edf7;
        font: 400 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      p {
        margin: 0;
        max-width: 34ch;
        color: #93a2b8;
      }
      /* Nothing is shown while the redirect is being made. The replace runs
         as the body is parsed, so the page is normally never painted at all —
         a "turning on dev mode…" line would be text almost nobody sees, and
         the one group who would see it is the group it would be wrong for
         (scripts off, where it never gets turned on). */
      .failed {
        display: none;
      }
      /* Shown only if storage refused. The script cannot report a failure by
         redirecting — a redirect is the one outcome that would be a lie. */
      html.nostore .failed {
        display: block;
      }
    </style>
  </head>
  <body>
    <p class="failed">
      This browser refused local storage, so dev mode cannot be remembered.
      Private windows and blocked cookies both do this. Nothing was changed.
    </p>

    <script>
      (function () {
        var root = document.documentElement;

        /* The track endpoint, written out here for the second time. The other
           copy is at the top of scripts/stats.js, and the two have to be
           edited together — the house duplicates small helpers on purpose
           rather than sharing them, but this one is a value rather than a
           function, so nothing fails loudly if they drift. This page loads no
           other script and must not start to. */
        var TRACK_URL =
          "https://llbtwjrfsuwfjgswbvpq.supabase.co/functions/v1/track";

        /* The fact this page exists to record: /dev was reached. Sent first,
           before storage is even attempted, because the count wanted is "how
           many people hit the dev entry" — and someone whose browser refused
           local storage hit it just as much as anyone else, even though they
           leave without dev mode on.

           A beacon rather than a fetch, because this page is leaving in the
           next statement and a beacon is the one request the browser keeps
           alive across that on its own. Never waited on: there is no answer
           worth delaying a redirect for, and nothing here can report a
           failure without becoming a lie.

           text/plain, though the body is json and the function parses it as
           json. The type is chosen for the browser rather than the server:
           text/plain is one of the three CORS-safelisted types, so this goes
           out as a simple request with no preflight. application/json would
           need an OPTIONS round trip first and this page has no time to make
           one. scripts/stats.js sends the real type because by the time it
           flushes, it has been on the page for fifteen seconds and its
           preflight is already cached. */
        if (navigator.sendBeacon) {
          navigator.sendBeacon(
            TRACK_URL,
            new Blob([JSON.stringify({ events: [{ kind: "dev" }] })], {
              type: "text/plain;charset=UTF-8"
            })
          );
        }

        try {
          localStorage.setItem("dev", "1");
        } catch (e) {
          root.className = "nostore";
          return;
        }
        /* `replace`, not `href`: assigning `href` leaves this page in the
           history, so Back from the site would land here and bounce straight
           back — a trap with no way out but a second press.

           Relative rather than "/", so it is correct served from the repo root
           on Pages and equally correct from any local server that serves the
           folder under a subpath.

           The search string is carried across because ?turn= is read on the
           other side and outranks the stored key — so /dev?turn=fall would
           otherwise have its override consumed by this page and silently
           dropped. It used to matter for ?stats=true too; that panel is gone,
           and the parameter with it. */
        location.replace("../" + location.search);
      })();
    </script>

    <noscript>
      <p>
        Dev mode is a script, and scripts are off. The site itself still works
        without them; this switch does not.
      </p>
    </noscript>
  </body>
</html>
